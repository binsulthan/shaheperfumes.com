<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHAH’E PERFUMES</title>
<meta name="description" content="SHAH’E PERFUMES — premium EDPs and attars.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--burgundy:#3b0d29;--dark:#45121f;--light:#70263a;--gold:#d9b76b;--cream:#f8f1e5;--muted:#dfcfbd;--line:rgba(217,183,107,.55);--box-gold:#d9b76b;--box-text:#45121f}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:"Cormorant Garamond",Georgia,serif;background:var(--burgundy);color:var(--cream);font-size:17px}
h1,h2,h3,h4,.brand,nav,.btn,.cart-btn,select,input{font-family:"Cinzel","Cormorant Garamond",Georgia,serif}button,select,input{font:inherit}a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:50;background:rgba(53,17,27,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.nav{max-width:1180px;margin:auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo-wrap{display:flex;align-items:center;gap:10px}.logo{width:140px;height:auto;object-fit:contain}
nav{display:flex;gap:22px;align-items:center}nav a{font-size:14px;letter-spacing:1px}nav a:hover{color:var(--gold)}
.cart-btn{border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:22px;padding:9px 15px;cursor:pointer}
.hero{max-width:1180px;margin:auto;padding:20px 20px 0;background:var(--burgundy)}
.hero-image{width:100%;height:410px;display:block;object-fit:contain;object-position:center;background:var(--burgundy);border-radius:18px;box-shadow:0 10px 28px rgba(0,0,0,.16)}
.tagline{text-align:center;color:var(--gold);font-family:"Cinzel",serif;font-size:25px;letter-spacing:4px;margin:20px 0 0;font-weight:600;text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.15)}
.section{max-width:1180px;margin:auto;padding:55px 20px}.section-title{text-align:center;margin:0 0 28px;color:var(--box-text);letter-spacing:4px;font-size:31px;font-weight:600}
.collection-box{background:var(--box-gold);color:var(--box-text);border:1px solid rgba(217,183,107,.85);border-radius:22px;padding:25px;box-shadow:0 14px 35px rgba(0,0,0,.18)}
.category-boxes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-bottom:25px}.category-box{background:transparent;border:1px solid rgba(69,18,31,.35);border-radius:18px;padding:25px;text-align:center;cursor:pointer;transition:.2s}.category-box:hover{transform:translateY(-3px);background:rgba(69,18,31,.06)}.category-box h3{margin:0 0 7px;color:var(--box-text);font-size:25px;letter-spacing:2px}.category-box p{margin:0;color:var(--box-text);font-size:14px}
.controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin:10px 0 25px}.filters{display:flex;gap:10px;flex-wrap:wrap}select,.search{background:var(--dark);color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
.product-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.product-card{background:var(--light);border:1px solid var(--line);border-radius:17px;padding:13px;box-shadow:0 8px 20px rgba(0,0,0,.15);display:flex;flex-direction:column;cursor:pointer;min-width:0;transition:.2s}.product-card:hover{transform:translateY(-2px)}.product-card img{width:100%;aspect-ratio:1/1;object-fit:contain;background:var(--dark);border-radius:12px;margin-bottom:12px}.product-card h4{margin:2px 0 5px;color:var(--cream);font-size:16px}.type{font-size:11px;color:var(--gold);letter-spacing:1px;text-transform:uppercase}.price{color:var(--gold);font-weight:bold;margin:7px 0 12px}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:auto}.btn{border:1px solid var(--gold);border-radius:9px;padding:8px 6px;cursor:pointer;background:transparent;color:var(--gold);font-size:12px}.btn.primary{background:var(--gold);color:var(--dark)}.btn:hover{opacity:.88}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:100;align-items:center;justify-content:center;padding:18px}.modal-bg.show{display:flex}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--burgundy);border:1px solid var(--gold);border-radius:18px;box-shadow:0 12px 35px rgba(0,0,0,.35);padding:23px;position:relative}.close{position:absolute;right:13px;top:10px;background:none;border:0;color:var(--cream);font-size:27px;cursor:pointer}
.modal-product{display:grid;grid-template-columns:170px 1fr;gap:20px;align-items:start}.modal-product img{width:170px;height:170px;object-fit:contain;background:var(--dark);border-radius:12px}.modal h2{margin:0 35px 8px 0;color:var(--gold)}.modal p{color:var(--muted);line-height:1.55}.modal-price{font-size:20px;color:var(--gold);font-weight:bold}.modal-actions{display:flex;gap:10px;margin-top:18px}
.cart-items{display:flex;flex-direction:column;gap:11px}.cart-item{display:grid;grid-template-columns:65px 1fr auto;gap:11px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:11px}.cart-item img{width:65px;height:65px;object-fit:contain;background:var(--dark);border-radius:8px}.cart-name{font-weight:bold}.cart-meta{font-size:12px;color:var(--muted);margin-top:4px}.qty{display:flex;align-items:center;gap:7px;margin-top:7px}.qty button{width:25px;height:25px;border:1px solid var(--line);background:transparent;color:var(--gold);border-radius:5px;cursor:pointer}.delete{border:0;background:transparent;color:#f2c9c9;font-size:20px;cursor:pointer}
.summary{margin-top:20px;border-top:1px solid var(--line);padding-top:15px}.summary-row{display:flex;justify-content:space-between;margin:7px 0}.total{font-size:20px;color:var(--gold);font-weight:bold}.shipping-note{font-size:12px;color:var(--muted);line-height:1.5;margin:12px 0}
.contact-box{max-width:700px;margin:auto;text-align:center;background:rgba(74,18,32,.42);border:1px solid var(--line);border-radius:20px;padding:30px}.contact-box p{color:var(--muted);line-height:1.7}.contact-links{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}footer{text-align:center;border-top:1px solid var(--line);padding:28px 20px;color:var(--muted);font-size:12px}.empty{text-align:center;color:var(--muted);padding:35px 10px}
@media(max-width:900px){.product-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:680px){.nav{padding:10px 13px}.logo{width:110px;height:auto}nav a{display:none}.hero{padding:12px 12px 0}.hero-image{border-radius:12px;height:auto;min-height:0}.tagline{font-size:17px;letter-spacing:3px;margin:14px 0 0}.section{padding:40px 12px}.section-title{font-size:24px}.collection-box{padding:15px}.category-boxes{gap:10px}.category-box{padding:18px 10px}.category-box h3{font-size:19px}.product-grid{grid-template-columns:repeat(2,1fr);gap:11px}.product-card{padding:9px}.product-card h4{font-size:14px}.card-actions{grid-template-columns:1fr}.modal-product{grid-template-columns:110px 1fr;gap:13px}.modal-product img{width:110px;height:110px}}
</style>
</head>
<body>
<header><div class="nav">
<a class="logo-wrap" href="#home"><img class="logo" src="Logo.png" alt="SHAH’E Perfumes"></a>
<nav><a href="#home">HOME</a><a href="#collections">COLLECTIONS</a><a href="#contact">CONTACT</a><button class="cart-btn" onclick="openCart()">CART <span class="cart-count">0</span></button></nav>
</div></header>

<main id="home">
<section class="hero"><img class="hero-logo" src="Logo.png" alt="SHAH’E PERFUMES"><div class="tagline">THEY FOLLOW YOUR SCENT</div></section>
<section class="section" id="collections">
<div class="collection-box">
<h2 class="section-title">COLLECTIONS</h2>
<div class="controls"><div class="filters">
<select id="category" onchange="renderProducts()"><option value="All">All Collections</option><option value="EDP">EDPs</option><option value="Attar">Attars</option></select>
<select id="sort" onchange="renderProducts()"><option value="alpha">Alphabetical</option><option value="high">Price High to Low</option><option value="low">Price Low to High</option><option value="category">Category</option><option value="sold">Most Sold</option></select>
</div><input id="search" class="search" type="search" placeholder="Search collection..." oninput="renderProducts()"></div>
<div id="productGrid" class="product-grid"></div>
</div></section>

<section class="section" id="contact"><h2 class="section-title">CONTACT</h2><div class="contact-box">
<p>For further assistance, please leave us a message. We will be happy to contact you.</p>
<div class="contact-links"><a class="btn primary" href="mailto:shaheperfumes@gmail.com">EMAIL US</a><a class="btn" href="https://wa.me/919497864457" target="_blank" rel="noopener">WHATSAPP</a></div>
<p>shaheperfumes@gmail.com<br>+91 94978 64457</p>
</div></section>
</main>
<footer>© SHAH’E PERFUMES. All rights reserved.</footer>

<div class="modal-bg" id="productModal" onclick="backgroundClose(event,'productModal')"><div class="modal"><button class="close" onclick="closeModal('productModal')">×</button><div id="productModalContent"></div></div></div>
<div class="modal-bg" id="cartModal" onclick="backgroundClose(event,'cartModal')"><div class="modal"><button class="close" onclick="closeModal('cartModal')">×</button><h2>YOUR CART</h2><div id="cartContent"></div></div></div>

<script>
const products=[
{name:"CR7",type:"EDP",size:"8 ML",price:150,image:"cr7-spray.jpeg",sold:6},
{name:"Lovely",type:"Attar",size:"6 ML",price:150,image:"lovely-attar.jpeg",sold:1},
{name:"Lovely",type:"EDP",size:"8 ML",price:150,image:"lovely-spray.jpeg",sold:1},
{name:"Marge",type:"EDP",size:"8 ML",price:150,image:"marge-spray.jpeg",sold:10},
{name:"Misk Rijali",type:"Attar",size:"6 ML",price:300,image:"misk-rijali-attar.jpeg",sold:5},
{name:"Misk Rijali",type:"EDP",size:"8 ML",price:250,image:"misk-rijali-spray.jpeg",sold:5},
{name:"Oud Kuwaiti",type:"Attar",size:"6 ML",price:300,image:"oud-kuwaiti-attar.jpeg",sold:8},
{name:"Oud Kuwaiti",type:"EDP",size:"8 ML",price:250,image:"oud-kuwaiti-spray.jpeg",sold:8},
{name:"Oud Nabeel",type:"EDP",size:"8 ML",price:150,image:"oud-nabeel-spray.jpeg",sold:7},
{name:"Polo Blue",type:"Attar",size:"6 ML",price:150,image:"polo-blue-attar.jpeg",sold:2},
{name:"Polo Blue",type:"EDP",size:"8 ML",price:150,image:"polo-blue-spray.jpeg",sold:2},
{name:"Sabaya",type:"Attar",size:"6 ML",price:150,image:"sabaya-attar.jpeg",sold:1},
{name:"Sabaya",type:"EDP",size:"8 ML",price:150,image:"sabaya-spray.jpeg",sold:1},
{name:"Solid",type:"Attar",size:"6 ML",price:150,image:"solid-attar.jpeg",sold:1},
{name:"Solid",type:"EDP",size:"8 ML",price:150,image:"solid-spray.jpeg",sold:1},
{name:"White Oud",type:"EDP",size:"8 ML",price:150,image:"white-oud-spray.jpeg",sold:4}
];
let cart=JSON.parse(localStorage.getItem("shaheCart")||"[]");
function saveCart(){localStorage.setItem("shaheCart",JSON.stringify(cart));updateCartCount()}
function updateCartCount(){document.querySelectorAll(".cart-count").forEach(e=>e.textContent=cart.reduce((s,x)=>s+x.qty,0))}
function setCategory(c){document.getElementById("category").value=c;renderProducts();document.getElementById("collections").scrollIntoView({behavior:"smooth"})}
function renderProducts(){
let category=document.getElementById("category").value,sort=document.getElementById("sort").value,q=document.getElementById("search").value.trim().toLowerCase();
let list=products.filter(p=>(category==="All"||p.type===category)&&(!q||p.name.toLowerCase().includes(q)));
if(sort==="alpha")list.sort((a,b)=>(a.name+" "+a.type).localeCompare(b.name+" "+b.type));
if(sort==="high")list.sort((a,b)=>b.price-a.price||a.name.localeCompare(b.name));
if(sort==="low")list.sort((a,b)=>a.price-b.price||a.name.localeCompare(b.name));
if(sort==="category")list.sort((a,b)=>a.type.localeCompare(b.type)||a.name.localeCompare(b.name));
if(sort==="sold"){const priority=["Marge","CR7","Oud Kuwaiti","Oud Nabeel","White Oud","Misk Rijali"];list.sort((a,b)=>{let pa=priority.indexOf(a.name),pb=priority.indexOf(b.name);if(pa!==-1&&pb!==-1)return pa-pb;if(pa!==-1)return-1;if(pb!==-1)return 1;return Math.random()-.5})}
document.getElementById("productGrid").innerHTML=list.length?list.map(p=>`<div class="product-card" onclick="openProduct(${products.indexOf(p)})"><img src="${p.image}" alt="${p.name} ${p.type}"><div class="type">${p.type}</div><h4>${p.name}</h4><div class="price">₹${p.price}</div><div class="card-actions"><button class="btn" onclick="event.stopPropagation();openProduct(${products.indexOf(p)})">View Details</button><button class="btn primary" onclick="event.stopPropagation();addToCart(${products.indexOf(p)})">Add to Cart</button></div></div>`).join(""):'<div class="empty" style="grid-column:1/-1">No products found.</div>'
}
function openProduct(i){
let p=products[i];
document.getElementById("productModalContent").innerHTML=`<div class="modal-product"><img src="${p.image}" alt="${p.name}"><div><div class="type">${p.type}</div><h2>${p.name}</h2><p>${p.type==="EDP"?"Eau de Parfum":"Concentrated Perfume Oil"} · ${p.size}<br>Long-lasting fragrance — up to 12 hours.</p><div class="modal-price">₹${p.price}</div></div></div><div class="modal-actions"><button class="btn primary" onclick="addToCart(${i});closeModal('productModal')">ADD TO CART</button><button class="btn" onclick="orderNow(${i})">ORDER NOW</button></div>`;
document.getElementById("productModal").classList.add("show")
}
function addToCart(i){let e=cart.find(x=>x.index===i);if(e)e.qty++;else cart.push({index:i,qty:1});saveCart()}
function orderNow(i){addToCart(i);closeModal("productModal");openCart()}
function changeQty(i,d){let e=cart.find(x=>x.index===i);if(!e)return;e.qty+=d;if(e.qty<1)cart=cart.filter(x=>x.index!==i);saveCart();renderCart()}
function deleteItem(i){cart=cart.filter(x=>x.index!==i);saveCart();renderCart()}
function renderCart(){
let el=document.getElementById("cartContent");if(!cart.length){el.innerHTML='<div class="empty">Your cart is empty.</div>';return}
let subtotal=0,count=0;
let rows=cart.map(item=>{let p=products[item.index];subtotal+=p.price*item.qty;count+=item.qty;return `<div class="cart-item"><img src="${p.image}" alt="${p.name}"><div><div class="cart-name">${p.name} — ${p.type}</div><div class="cart-meta">${p.size} · ₹${p.price}</div><div class="qty"><button onclick="changeQty(${item.index},-1)">−</button><span>${item.qty}</span><button onclick="changeQty(${item.index},1)">+</button></div></div><button class="delete" title="Delete" onclick="deleteItem(${item.index})">🗑</button></div>`}).join("");
let free=count>=3,shipping=free?0:50,total=subtotal+shipping;
el.innerHTML=`<div class="cart-items">${rows}</div><div class="summary"><div class="summary-row"><span>Subtotal</span><span>₹${subtotal}</span></div><div class="summary-row"><span>Shipping</span><span>${free?"FREE":"₹50"}</span></div><div class="shipping-note">${free?"Free delivery across Kerala applies to orders of 3 or more products.":"Add another product to reach 3 products and qualify for free delivery across Kerala. Shipping is ₹50 for 1–2 products."}</div><div class="summary-row total"><span>Total</span><span>₹${total}</span></div><button class="btn primary" style="width:100%;margin-top:14px;padding:12px" onclick="placeOrder()">PLACE YOUR ORDER</button></div>`
}
function placeOrder(){
if(!cart.length)return;let subtotal=0,count=0,lines=[];
cart.forEach(item=>{let p=products[item.index];subtotal+=p.price*item.qty;count+=item.qty;lines.push(`${p.name} ${p.type} ${p.size} x${item.qty} - ₹${p.price*item.qty}`)});
let free=count>=3,shipping=free?0:50,total=subtotal+shipping;
let msg=`Hello SHAH’E PERFUMES,\n\nI would like to place an order:\n\n${lines.join("\n")}\n\nSubtotal: ₹${subtotal}\nShipping: ${free?"FREE":"₹50"}\nTotal: ₹${total}\n\n${free?"Free delivery across Kerala applies.":"Please confirm the shipping charge and delivery details."}`;
window.open("https://wa.me/919497864457?text="+encodeURIComponent(msg),"_blank")
}
function openCart(){renderCart();document.getElementById("cartModal").classList.add("show")}
function closeModal(id){document.getElementById(id).classList.remove("show")}
function backgroundClose(e,id){if(e.target.id===id)closeModal(id)}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal("productModal");closeModal("cartModal")}})
renderProducts();updateCartCount();
</script>
</body>
</html>
